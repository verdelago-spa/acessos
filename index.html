<title>Registo de Acessos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: barra de topo com logótipo Verdelago Spa + separadores; "Hoje" = formulário à esquerda, grelha à direita. Marca: preto e dourado champanhe (#E8D5AA); semáforo à parte. */
:root{
  --bg:#f6f5f2; --surface:#ffffff; --surface2:#faf9f6; --ink:#0d0d0d; --muted:#6a655a; --line:#e4dfd2;
  --accent:#0d0d0d; --accent-ink:#ffffff; --accent-soft:#f1e8cd; --gold:#e8d5aa; --gold-deep:#b79c55; --bar:#cdb678;
  --ok:#2e9a5a; --ok-soft:#dcf2e4; --warn:#d9a90b; --warn-soft:#fbf0c6; --high:#e57a1c; --high-soft:#fde2c8; --bad:#d23a3a; --bad-soft:#fbd9d9;
  --t-guest:#1f4d3b; --t-guest-ink:#ffffff; --t-prop:#e6c870; --t-prop-ink:#2b2200; --t-vis:#c3d0de; --t-vis-ink:#1b2733; --t-ext:#e5c3ae; --t-ext-ink:#3a2417; --t-none:#f3f2ee; --t-res:#e4daf1; --t-res-ink:#2b2040; --t-res-line:#7b5fb0;
  --font-display:"Jost","Figtree",system-ui,sans-serif; --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0b0b; --surface:#151515; --surface2:#1b1b1a; --ink:#f2ede1; --muted:#a39d8e; --line:#2b2a26;
  --accent:#e8d5aa; --accent-ink:#0b0b0b; --accent-soft:#2c2616; --gold:#e8d5aa; --gold-deep:#e8d5aa; --bar:#c9b27a;
  --ok:#4cc27c; --ok-soft:#1c3b2a; --warn:#e8c43a; --warn-soft:#3d3511; --high:#f0953f; --high-soft:#42290f; --bad:#ef6a6a; --bad-soft:#47191a;
  --t-guest:#2a6b52; --t-guest-ink:#ffffff; --t-prop:#d4b25c; --t-prop-ink:#241c00; --t-vis:#42566b; --t-vis-ink:#f1f5f9; --t-ext:#7a5441; --t-ext-ink:#fbf1ea; --t-none:#1c1c1b; --t-res:#4a3c66; --t-res-ink:#f0e9fc; --t-res-line:#b9a0ea; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0b0b; --surface:#151515; --surface2:#1b1b1a; --ink:#f2ede1; --muted:#a39d8e; --line:#2b2a26;
  --accent:#e8d5aa; --accent-ink:#0b0b0b; --accent-soft:#2c2616; --gold:#e8d5aa; --gold-deep:#e8d5aa; --bar:#c9b27a;
  --ok:#4cc27c; --ok-soft:#1c3b2a; --warn:#e8c43a; --warn-soft:#3d3511; --high:#f0953f; --high-soft:#42290f; --bad:#ef6a6a; --bad-soft:#47191a;
  --t-guest:#2a6b52; --t-guest-ink:#ffffff; --t-prop:#d4b25c; --t-prop-ink:#241c00; --t-vis:#42566b; --t-vis-ink:#f1f5f9; --t-ext:#7a5441; --t-ext-ink:#fbf1ea; --t-none:#1c1c1b; --t-res:#4a3c66; --t-res-ink:#f0e9fc; --t-res-line:#b9a0ea; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
h1,h2,h3{font-family:var(--font-display);font-weight:500;letter-spacing:.03em;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0 8px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand h1{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
.logo{height:58px;width:auto;max-width:none;align-self:flex-start;display:block}.logo.mk{display:none;height:46px}.logo-d{display:none}
@media (max-width:640px){.logo.hz{display:none}.logo.mk{display:block}.logo-d.mk,.logo-l.hz{display:none}}
.line-gold{height:2px;background:linear-gradient(90deg,var(--gold),transparent);border:0;margin:0 0 12px}
.brand span{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;background:var(--surface2);border:1px solid var(--line);padding:4px;border-radius:12px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 16px;border-radius:9px;font-weight:600;color:var(--muted);min-height:44px;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 14px;border-radius:9px;font-weight:600;min-height:44px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.muted{color:var(--muted)}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px;font-size:15px;color:var(--ink);width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;border:0;background:transparent;padding:10px 8px;font-weight:600;min-height:44px;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:48px;height:48px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:22px;font-weight:700}
.stepper output{min-width:40px;text-align:center;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.hoje{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.hoje{grid-template-columns:minmax(0,1fr)}}
.form{display:flex;flex-direction:column;gap:12px}
.grp{display:flex;flex-direction:column;gap:5px}.stepper.sm{gap:4px}.stepper.sm button{width:42px;height:44px;font-size:20px}.stepper.sm output{min-width:30px;font-size:20px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.datebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.datebar .big{font-family:var(--font-display);font-size:20px;font-weight:500;letter-spacing:.02em}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.pill i{width:9px;height:9px;border-radius:50%;background:currentColor;display:inline-block}
.n0{background:var(--ok-soft);color:var(--ok)}.n1{background:var(--warn-soft);color:var(--warn)}.n2{background:var(--high-soft);color:var(--high)}.n3{background:var(--bad-soft);color:var(--bad)}
.pill.n1{color:#8a6a00}.pill.n2{color:#a24f00}
:root[data-theme="dark"] .pill.n1,:root[data-theme="dark"] .pill.n2{color:inherit}
.prev{font-size:14px;padding:10px 12px;border-radius:8px;background:var(--surface2);border:1px solid var(--line)}
.sumrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sum{flex:1 1 200px;border:1px solid var(--line);border-radius:var(--radius);padding:6px 12px;font-size:13px;background:var(--surface)}
.sum b{font-family:var(--font-display);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.gridwrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);max-height:none}
table.g{--rh:clamp(18px,calc((100vh - 395px)/27),30px);border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;width:100%}
table.g .pill{padding:0 8px;font-size:11px;line-height:17px}
table.g th,table.g td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;text-align:center;font-size:12px;height:var(--rh)}
table.g thead th{position:sticky;top:0;background:var(--surface2);z-index:2;font-size:12px;color:var(--muted)}
table.g th.h{position:sticky;left:0;background:var(--surface2);z-index:1;text-align:left;padding:0 10px;white-space:nowrap;font-weight:600;color:var(--ink)}
table.g thead th.h{z-index:3}
table.g td.c{min-width:44px}
table.g td.c button{all:unset;display:block;width:100%;height:100%;line-height:var(--rh);cursor:pointer;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-guest{background:var(--t-guest);color:var(--t-guest-ink)}.t-prop{background:var(--t-prop);color:var(--t-prop-ink)}.t-vis{background:var(--t-vis);color:var(--t-vis-ink)}.t-ext{background:var(--t-ext);color:var(--t-ext-ink)}.t-none{background:var(--t-none);box-shadow:inset 0 0 0 1px var(--line)}
table.g td.al{min-width:150px;white-space:nowrap;padding:0 8px;text-align:left}
.rec-head{display:flex;gap:12px 20px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.rec-clock{font-family:var(--font-display);font-size:34px;font-weight:500;letter-spacing:.04em}
.recwrap{display:grid;gap:16px;align-items:start}
.rec-title{display:flex;gap:12px;align-items:center;margin-bottom:6px}.rec-title h2{font-size:22px}
.gridwrap.rec{max-height:none;overflow:auto}
table.g.rec{--rh:clamp(20px,calc((100vh - 250px)/27),42px)}
table.g.rec th,table.g.rec td{font-size:clamp(11px,1.5vh,16px)}
table.g.rec td.c{min-width:42px;font-weight:700}
table.g.rec td.al{min-width:130px}
tr.nowrow th.h{background:var(--gold);color:#0d0d0d}
tr.nowrow td{box-shadow:inset 0 2px 0 var(--gold-deep),inset 0 -2px 0 var(--gold-deep)}
#rexit{display:none;position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:12px;z-index:30;opacity:.6}
.recfull #rexit{display:block}.recfull .top{display:none}.recfull .rec-head .btn#rfs{display:none}
sup.kid{font-size:9px;font-weight:700;margin-left:1px;color:var(--gold-deep)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:10px 0 0}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block;border:1px solid var(--line)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.tbl{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.tbl table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:14px;white-space:nowrap}
.tbl th{position:sticky;top:0;background:var(--surface2);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tbl td.notes{white-space:normal;min-width:180px;max-width:320px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.kpi table{width:100%;border-collapse:collapse}
.kpi td{padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.kpi td:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:3px}
.bar{display:grid;grid-template-columns:48px 1fr 40px;gap:8px;align-items:center;font-size:12px;font-variant-numeric:tabular-nums}
.bar div.t{height:14px;background:var(--surface2);border-radius:4px;overflow:hidden}
.bar div.t i{display:block;height:100%;background:var(--bar);border-radius:4px}
.sec{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.sec h2{font-size:18px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.heat td,.heat th{padding:6px 8px;text-align:center;font-size:12px;border:1px solid var(--surface)}
.heat{border-collapse:collapse;font-variant-numeric:tabular-nums}
.note-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.note-item .d{min-width:130px;font-weight:600}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:14px;padding:20px;width:min(480px,100%);max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;z-index:60;font-weight:600;max-width:90vw}
.empty{padding:28px;text-align:center;color:var(--muted)}
.banner{background:var(--bad-soft);color:var(--bad);padding:10px 14px;border-radius:8px;margin:8px 0;font-weight:600}
@media (prefers-reduced-motion:no-preference){.toast{animation:in .2s ease-out}@keyframes in{from{opacity:0;transform:translate(-50%,8px)}}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo-l{display:none!important}:root:not([data-theme="light"]) .logo-d.hz{display:block}:root:not([data-theme="light"]) .logo-d.mk{display:none}}
@media (prefers-color-scheme: dark) and (max-width:640px){:root:not([data-theme="light"]) .logo-d.hz{display:none}:root:not([data-theme="light"]) .logo-d.mk{display:block}}
:root[data-theme="dark"] .logo-l{display:none!important}:root[data-theme="dark"] .logo-d.hz{display:block}:root[data-theme="dark"] .logo-d.mk{display:none}
@media (max-width:640px){:root[data-theme="dark"] .logo-d.hz{display:none}:root[data-theme="dark"] .logo-d.mk{display:block}}
table.g td.c.res{background:var(--t-res);color:var(--t-res-ink);background-image:repeating-linear-gradient(135deg,transparent 0 5px,rgba(255,255,255,.35) 5px 9px);box-shadow:inset 6px 0 0 var(--tc,var(--t-res-line)),inset 0 0 0 2px var(--t-res-line)}
td.c.res.t-guest{--tc:var(--t-guest)}td.c.res.t-prop{--tc:var(--t-prop)}td.c.res.t-vis{--tc:var(--t-vis)}td.c.res.t-ext{--tc:var(--t-ext)}
.legend i.res{background:var(--t-res);box-shadow:inset 0 0 0 1.5px var(--t-res-line)}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 0 10px;padding-bottom:2px}
.chip{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;min-width:62px;padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:12px;color:var(--muted);box-sizing:border-box}
.chip b{font-size:16px;color:var(--ink)}.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--gold-deep)}
.qacts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn.big{min-height:56px;font-size:16px}
.resbox{border:1px solid var(--gold-deep);border-radius:var(--radius);padding:10px 12px;background:var(--surface);margin-bottom:10px}
.resbox h2{font-size:16px;margin:0 0 6px}
.resrow{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:6px 0;border-top:1px solid var(--line)}
.resrow .acts{display:flex;gap:6px}
#login{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
#login[hidden]{display:none}
.lgcard{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;display:flex;flex-direction:column;gap:12px}
.lgcard h2{margin:0;font-size:22px}.lglogo{display:flex;justify-content:flex-start;margin-bottom:4px}.lglogo .logo{height:64px;width:auto}
.lgerr{color:var(--bad);font-weight:600;min-height:20px;font-size:14px}
.btn[hidden],#who[hidden]{display:none!important}
</style>

<script>
(function(){
"use strict";
/* ---------- constantes ---------- */
const ESP=["Ginásio","Spa"], CAP={"Ginásio":10,"Spa":18}, THR={"Ginásio":[7,9,10],"Spa":[13,16,18]};
const TIPOS=["Guest","Proprietário","Visitante","Externo"], TCLS={"Guest":"t-guest","Proprietário":"t-prop","Visitante":"t-vis","Externo":"t-ext","":"t-none"};
const NIV=[{t:"LIVRE",e:"🟢"},{t:"A ENCHER",e:"🟡"},{t:"QUASE CHEIO",e:"🟠"},{t:"LOTAÇÃO EXCEDIDA",e:"🔴"}];
const DIAS=["Domingo","Segunda-feira","Terça-feira","Quarta-feira","Quinta-feira","Sexta-feira","Sábado"];
const DIAS3=["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"];
const MESES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const FAM=["11:00","13:00"]; // horário família do Spa (chegadas entre 11:00 e 12:30)
const endSlot=r=>{const s=slotOf(r.hora);let e=s+3;if(r.saiu&&/^\d\d:\d\d$/.test(r.saiu)){const m=Number(r.saiu.slice(0,2))*60+Number(r.saiu.slice(3))-420;e=Math.min(s+3,Math.max(s+1,Math.ceil(m/30)+1));}return e;};
const foraFam=h=>h<FAM[0]||h>=FAM[1];
const HORAS=[];for(let h=7;h<20;h++){HORAS.push(String(h).padStart(2,"0")+":00");HORAS.push(String(h).padStart(2,"0")+":30");}
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nivel=(e,n)=>{const [a,b,c]=THR[e];return n>c?3:n>=b?2:n>=a?1:0;};
const slotOf=h=>{const [hh,mm]=h.split(":").map(Number);return (hh-7)*2+(mm>=30?1:0)+1;};
const horaFim=h=>{let m=Math.min(Number(h.slice(0,2))*60+Number(h.slice(3))+90,1200);return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");};
const pad=n=>String(n).padStart(2,"0");
const isoOf=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseIso=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const addDays=(s,n)=>{const d=parseIso(s);d.setDate(d.getDate()+n);return isoOf(d);};
const dow=s=>parseIso(s).getDay();
const fmtLong=s=>{const [y,m,d]=s.split("-");return DIAS[dow(s)]+", "+Number(d)+" de "+MESES[Number(m)-1].toLowerCase()+" de "+y;};
const fmtShort=s=>{const [y,m,d]=s.split("-");return d+"/"+m+"/"+y;};
const today=()=>isoOf(new Date());
const nextSlotHora=()=>{const n=new Date();let m=n.getHours()*60+(n.getMinutes()>=30?30:0);m=Math.max(420,Math.min(m,1170));return pad(Math.floor(m/60))+":"+pad(m%60);};

/* ---------- estado ---------- */
const S={tab:"hoje",data:today(),esp:"Ginásio",ano:new Date().getFullYear(),mes:new Date().getMonth(),
  regs:[],idx:{},notasDia:{},db:null,dl:null,loaded:false,readonly:false,
  form:{hora:nextSlotHora(),quarto:"",tipo:"Guest",adultos:1,criancas:0,notas:"",modo:"",ate:"",horaManual:false},
  f:{escopo:"mes",esp:"",tipo:"",kid:"",est:"",q:"",max:150},unsub:[],watchedYear:null};

/* ---------- cálculo ---------- */
// A e T levem sempre 3 dígitos (A56 → A056); V fica como está (V1)
const expiraMs=r=>{const [y,m,d]=r.data.split("-").map(Number),[hh,mm]=r.hora.split(":").map(Number);return new Date(y,m-1,d,hh,mm+90).getTime();};
const normQ=q=>{q=String(q||"").trim().toUpperCase();const m=q.match(/^([AT])[\s-]*(\d{1,3})$/);return m?m[1]+m[2].padStart(3,"0"):q;};
function build(){
  // índice por dia|espaço, ordenado por hora de início, depois ordem de criação
  const idx={};
  for(const r of S.regs){if(r.quarto)r.quarto=normQ(r.quarto);r._slot=slotOf(r.hora);r._p=Math.max(1,Number(r.pessoas)||1);r._c=Math.min(Math.max(0,Number(r.criancas)||0),r._p);r._end=endSlot(r);r._exp=Date.now()>=expiraMs(r);r._auto=r.estado==="reserva"&&r._exp;r._off=r.estado==="faltou"||r._auto;if(r._off){r._ocup=0;r._niv=0;continue;}(idx[r.data+"|"+r.espaco]=idx[r.data+"|"+r.espaco]||[]).push(r);}
  S.idx=idx;
  for(const k in idx){
    const l=idx[k];
    for(const r of l){let t=0;for(const o of l){if(o._slot<=r._slot&&o._end>r._slot)t+=o._p;}r._ocup=t;r._niv=nivel(r.espaco,t);}
  }
}
function layout(data,esp){
  const list=(S.idx[data+"|"+esp]||[]).slice().sort((a,b)=>a._slot-b._slot||(a.criadoEm||0)-(b.criadoEm||0)||(a.id<b.id?-1:1));
  const nk=CAP[esp],F=Array(nk).fill(0),base={},place=[];
  for(const r of list){
    const cols=[];for(let c=0;c<nk&&cols.length<r._p;c++){if(F[c]<=r._slot)cols.push(c);}
    cols.forEach(c=>F[c]=r._end);
    let b=0;if(!r.quarto){const t=r.tipo||"";b=base[t]||0;base[t]=b+r._p;}
    place.push({r,cols,b,extra:r._p-cols.length});
  }
  const grid=Array.from({length:27},()=>Array(nk).fill(null)),tot=Array(27).fill(0);
  for(const p of place){for(let s=p.r._slot;s<p.r._end&&s<=26;s++){tot[s]+=p.r._p;p.cols.forEach((c,i)=>{grid[s][c]={r:p.r,kid:i>=p.r._p-p.r._c,label:p.r.quarto?String(p.r.quarto).trim():((p.r.tipo||"?")+" "+(p.b+i+1))};});}}
  return {grid,tot,nk,list,place};
}
const totForm=f=>f.adultos+(S.esp==="Spa"?f.criancas:0);
const qtd=r=>(r._p-r._c)+" ad."+(r._c?" + "+r._c+" cr.":"");
const modo=()=>S.form.modo||(S.data>today()?"reserva":"checkin");
const estPill=r=>r._auto?'<span class="pill n3" title="Reserva não confirmada"><i></i>Não veio (auto)</span>':r.estado==="reserva"?'<span class="pill n1"><i></i>Por confirmar</span>':r.estado==="faltou"?'<span class="pill n3"><i></i>Não veio</span>':'<span class="pill n0"><i></i>Veio</span>';
const estTxt=r=>r._auto?"Não veio (auto)":r.estado==="reserva"?"Reserva":r.estado==="faltou"?"Não veio":"Veio";
function nivelPill(esp,n){const v=nivel(esp,n);return '<span class="pill n'+v+'"><i></i>'+NIV[v].t+'</span>';}

/* ---------- ligação à base de dados ---------- */
const dlShim={save:async({filename,data})=>{

function startFB(){

  if(!A.configured){showLogin("Falta colar a configuração do Firebase no ficheiro (ver GUIA.md).");return;}
  if(A.failed||!A.onAuth){showLogin("Não foi possível carregar o Firebase. Confirma a ligação à internet e recarrega a página.");return;}
  A.onAuth(async u=>{
    if(u){
      S.user=u;S.admin=false;
      if(!u.isAnonymous){try{S.admin=await A.isAdmin(u.uid);}catch(e){}}
      S.db=A.db;S.dl=dlShim;hideLogin();

      $("#who").textContent=g?((u.email||"")+(S.admin?" · gestor":"")):"";$("#who").hidden=!g;
      $("#btnSair").hidden=!g;$("#btnGestor").hidden=g;$("#btnImp").hidden=!S.admin;
      S.watchedYear=null;watch(S.ano);render();
    }else{
      S.unsub.forEach(f=>{try{f()}catch(e){}});S.unsub=[];S.db=null;S.regs=[];S.idx={};S.notasDia={};S.loaded=false;S.watchedYear=null;S.user=null;S.admin=false;
      $("#who").hidden=true;$("#btnSair").hidden=true;$("#btnGestor").hidden=true;$("#btnImp").hidden=true;render();

    ${r.notas?`<div class="prev">${esc(r.notas)}</div>`:""}
    <div class="qacts">
      ${st==="reserva"?btn("veio","Veio",1):""}
      ${st==="veio"&&hoje&&!r.saiu?btn("saiu","Saiu agora",1):""}
      ${r.saiu?btn("semsaida","Anular saída"):""}
      ${st==="faltou"?btn("reserva","Desfazer «não veio»"):btn("faltou","Não veio")}
      ${btn("edit","Editar…")}${btn("close","Fechar")}
    </div></div></div>`;
  const close=()=>{L.innerHTML="";};
  $("#ov").addEventListener("mousedown",ev=>{if(ev.target.id==="ov")close();});
  $("#ov").addEventListener("click",async ev=>{
    const b=ev.target.closest("[data-q]");if(!b)return;const q=b.dataset.q;
    if(q==="close"){close();return;}
    if(q==="edit"){close();openEdit(id);return;}
    const n=new Date(),agora=pad(n.getHours())+":"+pad(n.getMinutes());
    const upd=q==="veio"?{estado:"veio"}:q==="faltou"?{estado:"faltou"}:q==="reserva"?{estado:"reserva"}:q==="saiu"?{saiu:agora}:{saiu:""};
    const msg=q==="veio"?"Confirmado: veio":q==="faltou"?"Marcado: não veio · coluna libertada":q==="reserva"?"Reposto como reserva":q==="saiu"?"Saída às "+agora+" · coluna libertada":"Saída anulada";
    if(await guardar(()=>S.db.collection("registos").doc(id).update(upd))){close();toast(msg);}
  });
}

  const L=$("#layer");
  L.innerHTML=`<div class="overlay" id="ov"><div class="modal" role="dialog" aria-label="Editar registo">
    <h2 style="font-size:18px">Editar check-in</h2>
    <div class="row2"><label>Data<input type="date" id="e_data" value="${esc(r.data)}"></label>
    <label>Espaço<select id="e_esp">${ESP.map(x=>`<option ${x===r.espaco?"selected":""}>${x}</option>`).join("")}</select></label></div>
    <div class="row2"><label>Hora de início<select id="e_hora">${HORAS.map(h=>`<option ${h===r.hora?"selected":""}>${h}</option>`).join("")}</select></label>
    <label>Nº quarto<input id="e_quarto" style="text-transform:uppercase" value="${esc(r.quarto||"")}"></label></div>
    <div class="row2"><label>Tipo<select id="e_tipo"><option value="">(sem tipo)</option>${TIPOS.map(x=>`<option ${x===r.tipo?"selected":""}>${x}</option>`).join("")}</select></label>
    <label>Adultos<input type="number" min="1" max="30" id="e_p" value="${Math.max(1,r._p-r._c)}"></label></div>
    <label>Estado<select id="e_est">${[["reserva","Reserva (por confirmar)"],["veio","Veio"],["faltou","Não veio"]].map(([k,n])=>`<option value="${k}" ${(r._auto?"faltou":(r.estado||"veio"))===k?"selected":""}>${n}</option>`).join("")}</select></label>
    <label>Crianças (só Spa)<input type="number" min="0" max="30" id="e_c" value="${r._c}"></label>
    <div class="row2"><label>Hora de saída (se saiu mais cedo)<input type="time" id="e_saiu" value="${esc(r.saiu||"")}"></label><button type="button" class="btn" id="e_agora" style="align-self:end">Saiu agora</button></div>
    <label>Notas<textarea id="e_notas">${esc(r.notas||"")}</textarea></label>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between">
      ${S.admin?'<button class="btn danger" id="e_del">Apagar</button>':""}
      <span style="display:flex;gap:8px"><button class="btn" id="e_cancel">Cancelar</button><button class="btn primary" id="e_save">Guardar</button></span>
    </div></div></div>`;
  const close=()=>{L.innerHTML="";};
  $("#e_cancel").onclick=close;
  $("#ov").addEventListener("mousedown",ev=>{if(ev.target.id==="ov")close();});
  $("#e_agora").onclick=async()=>{const n=new Date(),t=pad(n.getHours())+":"+pad(n.getMinutes());if(await guardar(()=>S.db.collection("registos").doc(id).update({saiu:t}))){close();toast("Saída às "+t+" · coluna libertada");}};
  $("#e_save").onclick=async()=>{
    const upd={data:$("#e_data").value,espaco:$("#e_esp").value,hora:$("#e_hora").value,quarto:normQ($("#e_quarto").value),tipo:$("#e_tipo").value,notas:$("#e_notas").value.trim()};
    upd.saiu=$("#e_saiu").value||"";upd.estado=$("#e_est").value;{const ad=Math.max(1,Number($("#e_p").value)||1);upd.criancas=upd.espaco==="Spa"?Math.min(30,Math.max(0,Number($("#e_c").value)||0)):0;upd.pessoas=ad+upd.criancas;}
    if(!upd.data){toast("Indica a data.");return;}
    if(await guardar(()=>S.db.collection("registos").doc(id).update(upd))){close();toast("Guardado");}
  };
  if($("#e_del"))$("#e_del").onclick=()=>{
    $("#e_del").outerHTML='<span class="muted">Apagar mesmo?</span> <button class="btn danger" id="e_del2">Sim, apagar</button>';
    $("#e_del2").onclick=async()=>{if(await guardar(()=>S.db.collection("registos").doc(id).delete())){close();toast("Apagado");}};

/* ---------- REGISTOS ---------- */
function renderRegistos(){
  const f=S.f;
  $("#main").innerHTML=`<div class="filters">
    <label>Período<select id="rf_esc"><option value="dia" ${f.escopo==="dia"?"selected":""}>Dia selecionado</option><option value="mes" ${f.escopo==="mes"?"selected":""}>Mês selecionado</option><option value="ano" ${f.escopo==="ano"?"selected":""}>Ano inteiro</option></select></label>
    <label>Dia / mês<input type="${f.escopo==="dia"?"date":"month"}" id="rf_dm" value="${f.escopo==="dia"?S.data:S.ano+"-"+pad(S.mes+1)}" ${f.escopo==="ano"?"disabled":""}></label>
    <label>Espaço<select id="rf_esp"><option value="">Todos</option>${ESP.map(x=>`<option ${f.esp===x?"selected":""}>${x}</option>`).join("")}</select></label>
    <label>Tipo<select id="rf_tipo"><option value="">Todos</option>${TIPOS.map(x=>`<option ${f.tipo===x?"selected":""}>${x}</option>`).join("")}<option value="__none" ${f.tipo==="__none"?"selected":""}>Sem tipo</option></select></label>
    <label>Crianças<select id="rf_kid"><option value="">Todas</option><option value="com" ${f.kid==="com"?"selected":""}>Só com crianças</option><option value="fora" ${f.kid==="fora"?"selected":""}>Crianças fora do horário família</option></select></label>
    <label>Estado<select id="rf_est"><option value="">Todos</option><option value="reserva" ${f.est==="reserva"?"selected":""}>Por confirmar</option><option value="veio" ${f.est==="veio"?"selected":""}>Veio</option><option value="faltou" ${f.est==="faltou"?"selected":""}>Não veio</option></select></label>
    <label>Procurar<input id="rf_q" value="${esc(f.q)}" placeholder="quarto ou nota"></label></div>
    <div id="regData"></div>`;
  renderRegistosData();
}
function filtrados(){
  const f=S.f;let a=S.regs;
  if(f.escopo==="dia")a=a.filter(r=>r.data===S.data);
  else if(f.escopo==="mes")a=a.filter(r=>Number(r.data.slice(5,7))===S.mes+1);
  if(f.esp)a=a.filter(r=>r.espaco===f.esp);
  if(f.tipo)a=a.filter(r=>f.tipo==="__none"?!r.tipo:r.tipo===f.tipo);
  if(f.kid==="com")a=a.filter(r=>r._c>0);else if(f.kid==="fora")a=a.filter(r=>r._c>0&&foraFam(r.hora));
  if(f.est)a=a.filter(r=>(r._auto?"faltou":(r.estado||"veio"))===f.est);
  if(f.q){const q=f.q.toLowerCase();a=a.filter(r=>((r.quarto||"")+" "+(r.notas||"")).toLowerCase().includes(q));}
  return a.slice().sort((x,y)=>x.data<y.data?1:x.data>y.data?-1:(x._slot-y._slot)||((x.criadoEm||0)-(y.criadoEm||0)));
}
function renderRegistosData(){
  const root=$("#regData");if(!root)return;
  const a=filtrados(),tp=a.reduce((s,r)=>s+(r._off?0:r._p),0);
  const rows=a.slice(0,S.f.max).map(r=>`<tr>
    <td>${fmtShort(r.data)}</td><td>${DIAS[dow(r.data)].slice(0,3)}</td><td>${r.espaco}</td><td>${r.hora}–${r.saiu?r.saiu+" (saiu)":horaFim(r.hora)}</td>
    <td><b>${esc(r.quarto||"—")}</b></td><td>${esc(r.tipo||"—")}</td><td>${r._p-r._c}</td><td>${r._c||""}${r._c&&foraFam(r.hora)?' <span class="pill n2" title="Fora do horário família">fora</span>':""}</td><td>${r._off?"—":r._ocup+"/"+CAP[r.espaco]}</td><td>${r._off?"":nivelPill(r.espaco,r._ocup)}</td><td>${estPill(r)}</td>
    <td class="notes">${esc(r.notas||"")}</td><td><button class="btn sm" data-edit="${r.id}">Editar</button> <button class="btn sm" data-goto="${r.data}|${r.espaco}">Ver grelha</button></td></tr>`).join("");
  root.innerHTML=`<p class="muted" style="margin:0 0 8px">${a.length} check-ins · ${tp} pessoas</p>`+(a.length?`<div class="tbl" style="max-height:70vh"><table><thead><tr><th>Data</th><th>Dia</th><th>Espaço</th><th>Horário</th><th>Quarto</th><th>Tipo</th><th>Adultos</th><th>Crianças</th><th>Ocup.</th><th>Alerta</th><th>Estado</th><th>Notas</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`+(a.length>S.f.max?`<p><button class="btn" id="more">Mostrar mais</button></p>`:""):'<div class="empty">Sem registos para estes filtros.</div>');
}
document.addEventListener("change",e=>{
  const t=e.target,f=S.f;
  if(t.id==="rf_esc"){f.escopo=t.value;renderRegistos();}
  else if(t.id==="rf_dm"&&t.value){if(f.escopo==="dia"){setDateOnly(t.value);}else{const [y,m]=t.value.split("-").map(Number);S.mes=m-1;if(y!==S.ano){S.ano=y;watch(y);}renderRegistosData();}}
  else if(t.id==="rf_esp"){f.esp=t.value;renderRegistosData();}
  else if(t.id==="rf_tipo"){f.tipo=t.value;renderRegistosData();}
  else if(t.id==="rf_kid"){f.kid=t.value;renderRegistosData();}
  else if(t.id==="rf_est"){f.est=t.value;renderRegistosData();}
});
function setDateOnly(d){S.data=d;const y=Number(d.slice(0,4));if(y!==S.ano){S.ano=y;watch(y);}renderRegistosData();}
document.addEventListener("input",e=>{if(e.target.id==="rf_q"){S.f.q=e.target.value;S.f.max=150;renderRegistosData();}});
document.addEventListener("click",e=>{if(e.target.id==="more"){S.f.max+=300;renderRegistosData();}});

/* ---------- ANÁLISE ---------- */
function renderAnalise(){
  const anos=[];for(let y=new Date().getFullYear()+1;y>=2025;y--)anos.push(y);
  $("#main").innerHTML=`<div class="filters" style="max-width:420px">
    <label>Ano<select id="an_ano">${anos.map(y=>`<option ${y===S.ano?"selected":""}>${y}</option>`).join("")}</select></label>
    <label>Mês<select id="an_mes">${MESES.map((m,i)=>`<option value="${i}" ${i===S.mes?"selected":""}>${m}</option>`).join("")}</select></label></div><div id="anData"></div>`;
  renderAnaliseData();
}
document.addEventListener("change",e=>{
  if(e.target.id==="an_ano"){S.ano=Number(e.target.value);watch(S.ano);S.data=S.ano+S.data.slice(4);renderAnaliseData();}
  else if(e.target.id==="an_mes"){S.mes=Number(e.target.value);renderAnaliseData();}
});
function stats(esp,list){
  const n=list.length,p=list.reduce((s,r)=>s+r._p,0),oc=list.map(r=>r._ocup);
  const mx=oc.length?Math.max(...oc):0,avg=oc.length?oc.reduce((a,b)=>a+b,0)/oc.length:0;
  return {n,p,c:list.reduce((s,r)=>s+r._c,0),gm:n?p/n:0,mx,avg,taxa:avg/CAP[esp],red:list.filter(r=>r._niv===3).length,org:list.filter(r=>r._niv===2).length};
}
function bars(list,esp){
  const by={};HORAS.forEach(h=>by[h]=[]);list.forEach(r=>{if(by[r.hora])by[r.hora].push(r._ocup);});
  return '<div class="bars">'+HORAS.map(h=>{const a=by[h],v=a.length?a.reduce((x,y)=>x+y,0)/a.length:0;return `<div class="bar"><span>${h}</span><div class="t"><i style="width:${Math.min(100,v/CAP[esp]*100)}%"></i></div><span>${a.length?v.toFixed(1):"–"}</span></div>`;}).join("")+'</div>';
}
function heat(esp,list){
  const m={};list.forEach(r=>{const w=(dow(r.data)+6)%7,k=r.hora+"|"+w;(m[k]=m[k]||[]).push(r._ocup);});
  let h='<div class="tbl" style="max-height:60vh"><table class="heat"><thead><tr><th>Hora</th>'+DIAS3.map(d=>`<th>${d}</th>`).join("")+'</tr></thead><tbody>';
  for(const hr of HORAS){h+=`<tr><th>${hr}</th>`;for(let w=0;w<7;w++){const a=m[hr+"|"+w];if(!a){h+="<td></td>";continue;}const v=a.reduce((x,y)=>x+y,0)/a.length;h+=`<td class="n${nivel(esp,Math.round(v))}">${v.toFixed(1)}</td>`;}h+="</tr>";}
  return h+"</tbody></table></div>";
}
function renderAnaliseData(){
  const root=$("#anData");if(!root)return;
  const ano=S.regs.filter(r=>!r._off),mes=ano.filter(r=>Number(r.data.slice(5,7))===S.mes+1);
  const by=e=>mes.filter(r=>r.espaco===e);
  const st={};ESP.forEach(e=>st[e]=stats(e,by(e)));
  const pct=v=>Math.round(v*100)+"%";
  const rows=[["Pessoas que visitaram",e=>st[e].p],["Total de check-ins",e=>st[e].n],["Das quais crianças",e=>st[e].c],["Tamanho médio do grupo",e=>st[e].gm.toFixed(1)],["Ocupação máxima em simultâneo",e=>st[e].mx],["Ocupação média por slot",e=>st[e].avg.toFixed(1)],["Taxa de ocupação média",e=>pct(st[e].taxa)],["Check-ins com lotação excedida",e=>st[e].red],["Check-ins quase cheio",e=>st[e].org],["Reservas em que não vieram",e=>S.regs.filter(r=>r._off&&r.espaco===e&&Number(r.data.slice(5,7))===S.mes+1).length]];
  let h=`<div class="kpis">`+ESP.map(e=>`<div class="card kpi"><h3>${e} · ${MESES[S.mes]} ${S.ano}</h3><table>${rows.map(([l,fn])=>`<tr><td>${l}</td><td>${fn(e)}</td></tr>`).join("")}</table></div>`).join("")+`</div>`;
  // por tipo
  const tipos=TIPOS.concat([""]);
  h+=`<div class="sec"><h2>Pessoas por tipo · ${MESES[S.mes]}</h2><div class="tbl"><table><thead><tr><th>Tipo</th><th>Ginásio</th><th>Spa</th></tr></thead><tbody>`+tipos.map(t=>`<tr><td>${t||"Sem tipo registado"}</td>`+ESP.map(e=>`<td>${by(e).filter(r=>(r.tipo||"")===t).reduce((s,r)=>s+r._p,0)}</td>`).join("")+"</tr>").join("")+`<tr><td><b>Total</b></td>`+ESP.map(e=>`<td><b>${st[e].p}</b></td>`).join("")+`</tr></tbody></table></div></div>`;
  // adultos e crianças no Spa por hora de início + horário família
  {const sp=by("Spa"),kr=sp.filter(r=>r._c>0),fora=kr.filter(r=>foraFam(r.hora)),dentro=kr.filter(r=>!foraFam(r.hora));
   const horasK=HORAS.filter(hh=>sp.some(r=>r.hora===hh));
   h+=`<div class="sec"><h2>Spa · adultos e crianças · ${MESES[S.mes]}</h2><div class="kpis"><div class="card kpi"><h3>Horário família ${FAM[0]}–${FAM[1]}</h3><table>
     <tr><td>Check-ins com crianças</td><td>${kr.length}</td></tr>
     <tr><td>Crianças no horário família</td><td>${dentro.reduce((a,r)=>a+r._c,0)}</td></tr>
     <tr><td>Crianças fora do horário família</td><td>${fora.reduce((a,r)=>a+r._c,0)}</td></tr>
     <tr><td>Adultos no horário família</td><td>${sp.filter(r=>!foraFam(r.hora)).reduce((a,r)=>a+r._p-r._c,0)}</td></tr></table></div>
     <div class="tbl" style="max-height:340px"><table><thead><tr><th>Hora início</th><th>Adultos</th><th>Crianças</th></tr></thead><tbody>${horasK.map(hh=>{const l=sp.filter(r=>r.hora===hh);const c=l.reduce((a,r)=>a+r._c,0),t=l.reduce((a,r)=>a+r._p,0);return `<tr${foraFam(hh)?"":' style="background:var(--accent-soft)"'}><td>${hh}${foraFam(hh)?"":" · família"}</td><td>${t-c}</td><td>${c}</td></tr>`;}).join("")||'<tr><td colspan="3" class="muted">Sem registos no Spa neste mês.</td></tr>'}</tbody></table></div></div></div>`;}
  // por hora
  h+=`<div class="sec"><h2>Ocupação média por hora de início · ${MESES[S.mes]}</h2><div class="two">`+ESP.map(e=>`<div class="card"><h3 style="font-size:15px;margin-bottom:8px">${e}</h3>${bars(by(e),e)}</div>`).join("")+`</div></div>`;
  // anual
  h+=`<div class="sec"><h2>Visão anual · ${S.ano}</h2><div class="tbl"><table><thead><tr><th>Mês</th><th>Pessoas Ginásio</th><th>Excedidos</th><th>Ocupação</th><th>Pessoas Spa</th><th>Excedidos</th><th>Ocupação</th></tr></thead><tbody>`;
  let mxP=1;const mm=MESES.map((_,i)=>{const l=ano.filter(r=>Number(r.data.slice(5,7))===i+1);const o={};ESP.forEach(e=>o[e]=stats(e,l.filter(r=>r.espaco===e)));mxP=Math.max(mxP,o["Ginásio"].p,o["Spa"].p);return o;});
  mm.forEach((o,i)=>{h+=`<tr><td>${MESES[i]}</td><td>${o["Ginásio"].p}</td><td>${o["Ginásio"].red}</td><td>${pct(o["Ginásio"].taxa)}</td><td>${o["Spa"].p}</td><td>${o["Spa"].red}</td><td>${pct(o["Spa"].taxa)}</td></tr>`;});
  h+=`</tbody></table></div><div class="two">`+ESP.map(e=>`<div class="card"><h3 style="font-size:15px;margin-bottom:8px">Pessoas por mês · ${e}</h3><div class="bars">${mm.map((o,i)=>`<div class="bar"><span>${MESES[i].slice(0,3)}</span><div class="t"><i style="width:${o[e].p/mxP*100}%"></i></div><span>${o[e].p}</span></div>`).join("")}</div></div>`).join("")+`</div></div>`;
  // calor
  h+=`<div class="sec"><h2>Mapa de calor · ${S.ano} (ocupação média, hora × dia da semana)</h2><div class="two">`+ESP.map(e=>`<div><h3 style="font-size:15px;margin-bottom:8px">${e}</h3>${heat(e,ano.filter(r=>r.espaco===e))}</div>`).join("")+`</div></div>`;
  root.innerHTML=h;
}

/* ---------- RECEÇÃO (ecrã fixo) ---------- */
function renderRececao(){
  const hj=today(),y=Number(hj.slice(0,4));if(y!==S.ano){S.ano=y;watch(y);}
  $("#main").innerHTML=`<div class="rec-head"><div><b class="rec-clock" id="rclock"></b> <span id="rdate" class="muted"></span></div>
    <div class="seg" id="rsel" style="max-width:340px">${[["ambos","Ambos"],["Ginásio","Ginásio"],["Spa","Spa"]].map(([k,n])=>`<button type="button" data-r="${k}" aria-pressed="${(S.rec||"ambos")===k}">${n}</button>`).join("")}</div>
    <button class="btn sm" id="rfs">Ecrã inteiro</button></div><div id="recData"></div>`;
  renderRececaoData();
}
function renderRececaoData(){
  const root=$("#recData");if(!root)return;
  const hj=today(),y=Number(hj.slice(0,4));if(y!==S.ano){S.ano=y;watch(y);}
  const n=new Date(),nowS=(n.getHours()*60+n.getMinutes()>=420&&n.getHours()<20)?(n.getHours()-7)*2+(n.getMinutes()>=30?1:0)+1:0;
  $("#rclock").textContent=pad(n.getHours())+":"+pad(n.getMinutes());$("#rdate").textContent=fmtLong(hj);
  const sel=S.rec||"ambos",lista=sel==="ambos"?ESP:[sel];
  root.innerHTML='<div class="recwrap" style="grid-template-columns:'+(lista.length>1?"auto auto":"1fr")+'">'+lista.map(e=>{
    const L=layout(hj,e),nk=L.nk,now=nowS?L.tot[nowS]:0;
    let h=`<section><div class="rec-title"><h2>${e}</h2><span>agora <b>${now}</b>/${nk}</span>${nivelPill(e,now)}</div><div class="gridwrap rec"><table class="g rec"><thead><tr><th class="h">Hora</th>`;
    for(let c=1;c<=nk;c++)h+=`<th>${c}</th>`;
    h+='<th>Ocup.</th></tr></thead><tbody>';
    for(let s=1;s<=26;s++){
      h+=`<tr class="${s===nowS?"nowrow":""}"><th class="h">${HORAS[s-1]}</th>`;
      for(let c=0;c<nk;c++){const g=L.grid[s][c];h+=g?`<td class="c ${TCLS[g.r.tipo||""]||"t-none"}${g.r.estado==="reserva"?" res":""}"><span>${esc(g.label)}${g.kid?'<sup class="kid">C</sup>':""}</span></td>`:'<td class="c"></td>';}
      const t=L.tot[s];h+=t?`<td class="al">${t}/${nk} ${nivelPill(e,t)}</td>`:'<td class="al"></td>';h+='</tr>';
    }
    return h+'</tbody></table></div></section>';
  }).join("")+'</div>'+(S.loaded?"":'<div class="empty">A carregar registos…</div>');
}
setInterval(()=>{if(S.tab==="rececao")renderRececaoData();},30000);
document.addEventListener("click",e=>{
  const t=e.target;
  const r=t.closest("#rsel [data-r]");if(r){S.rec=r.dataset.r;renderRececao();return;}
  if(t.id==="rfs"){document.body.classList.add("recfull");try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{});}catch(x){}return;}
  if(t.id==="rexit"){document.body.classList.remove("recfull");try{document.fullscreenElement&&document.exitFullscreen();}catch(x){}}
});
document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement)document.body.classList.remove("recfull");});

/* ---------- NOTAS ---------- */
function renderNotas(){
  $("#main").innerHTML=`<div class="filters" style="max-width:420px"><label>Procurar nas notas<input id="nq" value="${esc(S.nq||"")}" placeholder="texto, quarto…"></label></div><div class="card" id="notasData"></div>`;
  renderNotasData();
}
document.addEventListener("input",e=>{if(e.target.id==="nq"){S.nq=e.target.value;renderNotasData();}});
function renderNotasData(){
  const root=$("#notasData");if(!root)return;
  const q=(S.nq||"").toLowerCase();
  const items=[];
  Object.values(S.notasDia).forEach(n=>items.push({data:n.data,esp:n.espaco,tag:"Nota do dia",texto:n.texto,go:n.data+"|"+n.espaco}));
  S.regs.filter(r=>r.notas).forEach(r=>items.push({data:r.data,esp:r.espaco,tag:(r.quarto||r.tipo||"?")+" · "+r.hora,texto:r.notas,go:r.data+"|"+r.espaco}));
  const l=items.filter(i=>!q||(i.texto+" "+i.tag).toLowerCase().includes(q)).sort((a,b)=>a.data<b.data?1:-1);
  root.innerHTML=l.length?l.map(i=>`<div class="note-item"><div class="d">${fmtShort(i.data)}<br><span class="muted" style="font-weight:500">${i.esp}</span></div><div style="flex:1;min-width:0"><span class="pill n0" style="background:var(--accent-soft);color:var(--accent)">${esc(i.tag)}</span><div style="margin-top:4px;white-space:pre-wrap">${esc(i.texto)}</div></div><button class="btn sm" data-goto="${i.go}">Abrir dia</button></div>`).join(""):'<div class="empty">Ainda não há notas em '+S.ano+'. Escreve notas ao registar um check-in ou na "Nota do dia".</div>';
}

/* ---------- EXPORTAR ---------- */
$("#btnExp").onclick=()=>{
  $("#layer").innerHTML=`<div class="overlay" id="ov"><div class="modal" role="dialog" aria-label="Exportar">
  <h2 style="font-size:18px">Exportar para Excel</h2>
  <label>O que exportar<select id="x_esc"><option value="dia">Dia selecionado (${fmtShort(S.data)})</option><option value="mes" selected>${MESES[S.mes]} ${S.ano}</option><option value="ano">Ano ${S.ano} inteiro</option><option value="backup">Backup completo (Excel, todos os anos)</option><option value="backupjson">Backup completo (JSON, para migrar ou restaurar)</option></select></label>
  <label>Formato<select id="x_fmt"><option value="xlsx">Excel (.xlsx)</option><option value="csv">CSV (.csv)</option></select></label>
  <span class="muted" style="font-size:13px">Inclui dia da semana, hora fim, ocupação no slot, alerta, tipo e notas. O ficheiro Excel tem ainda uma folha com as notas do dia.</span>
  <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" id="x_c">Cancelar</button><button class="btn primary" id="x_ok">Exportar</button></div></div></div>`;
  $("#x_c").onclick=()=>{$("#layer").innerHTML="";};
  $("#ov").addEventListener("mousedown",ev=>{if(ev.target.id==="ov")$("#layer").innerHTML="";});
  $("#x_ok").onclick=async()=>{
    const esc_=$("#x_esc").value,fmt=$("#x_fmt").value;
    if(esc_==="backupjson"){
      try{
        if(!S.dl){toast("Backup indisponível nesta vista.");return;}
        const a=await S.db.collection("registos").get(),b=await S.db.collection("notas_dia").get();
        const o={versao:1,exportadoEm:new Date().toISOString(),registos:a.docs.map(d=>Object.assign({id:d.id},d.data())),notas_dia:b.docs.map(d=>Object.assign({id:d.id},d.data()))};
        await S.dl.save({filename:"Backup_Registo_Acessos_"+today()+".json",data:JSON.stringify(o)});
        $("#layer").innerHTML="";toast("Backup JSON pronto: "+o.registos.length+" registos");
      }catch(err){if(!err||err.code!=="declined")toast("Não foi possível exportar o backup ("+(err&&err.code||"erro")+").");}
      return;
    }
    if(esc_==="backup"){
      try{
        if(!S.dl||!window.XLSX){toast("Backup indisponível nesta vista.");return;}
        let regs=S.regs,notas=Object.values(S.notasDia),parcial=false;
        try{const a=await S.db.collection("registos").get(),b=await S.db.collection("notas_dia").get();regs=a.docs.map(d=>d.data());notas=b.docs.map(d=>d.data());}catch(x){parcial=true;}
        regs=regs.slice().sort((x,y)=>x.data<y.data?-1:x.data>y.data?1:x.hora<y.hora?-1:x.hora>y.hora?1:(x.criadoEm||0)-(y.criadoEm||0));
        const wb=XLSX.utils.book_new(),ws=XLSX.utils.aoa_to_sheet([["Data","Espaço","Hora início","Nº quarto","Tipo","Nº pessoas","Crianças","Hora de saída","Observações","Estado"]].concat(regs.map(r=>[r.data.split("-").reverse().join("/"),r.espaco,r.hora,r.quarto||"",r.tipo||"",Number(r.pessoas)||1,Number(r.criancas)||0,r.saiu||"",r.notas||"",estTxt(r)])));
        ws["!cols"]=[12,9,11,10,13,11,9,12,40,10].map(w=>({wch:w}));XLSX.utils.book_append_sheet(wb,ws,"Registos");
        const w2=XLSX.utils.aoa_to_sheet([["Data","Espaço","Nota"]].concat(notas.sort((x,y)=>x.data<y.data?-1:1).map(n=>[n.data.split("-").reverse().join("/"),n.espaco,n.texto])));XLSX.utils.book_append_sheet(wb,w2,"Notas do dia");
        await S.dl.save({filename:"Backup_Registo_Acessos_"+today()+".xlsx",data:XLSX.write(wb,{bookType:"xlsx",type:"array"})});
        $("#layer").innerHTML="";toast(parcial?"Backup só do ano aberto ("+S.ano+")":"Backup pronto: "+regs.length+" registos");
      }catch(err){if(!err||err.code!=="declined")toast("Não foi possível exportar o backup ("+(err&&err.code||"erro")+").");}
      return;
    }
    let a=S.regs;
    if(esc_==="dia")a=a.filter(r=>r.data===S.data);else if(esc_==="mes")a=a.filter(r=>Number(r.data.slice(5,7))===S.mes+1);
    a=a.slice().sort((x,y)=>x.data<y.data?-1:x.data>y.data?1:(x._slot-y._slot)||((x.criadoEm||0)-(y.criadoEm||0)));
    if(!a.length){toast("Não há registos neste período.");return;}
    const head=["Data","Dia da semana","Espaço","Hora início","Hora fim","Nº quarto","Tipo","Nº pessoas","Adultos","Crianças","Hora de saída","Ocupação no slot","Alerta","Notas","Estado"];
    const rows=a.map(r=>[r.data.split("-").reverse().join("/"),DIAS[dow(r.data)],r.espaco,r.hora,horaFim(r.hora),r.quarto||"",r.tipo||"",r._p,r._p-r._c,r._c,r.saiu||"",r._ocup,NIV[r._niv].e+" "+NIV[r._niv].t,r.notas||"",estTxt(r)]);
    const nome="Registo_Acessos_"+(esc_==="dia"?S.data:esc_==="mes"?S.ano+"-"+pad(S.mes+1):S.ano);
    try{
      if(!S.dl){toast("A exportação não está disponível nesta vista.");return;}
      if(fmt==="csv"){
        const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
        await S.dl.save({filename:nome+".csv",data:"\ufeff"+[head].concat(rows).map(r=>r.map(q).join(";")).join("\r\n")});
      }else{
        if(!window.XLSX){toast("A biblioteca Excel não carregou. Usa CSV.");return;}
        const wb=XLSX.utils.book_new(),ws=XLSX.utils.aoa_to_sheet([head].concat(rows));
        ws["!cols"]=[12,15,9,11,9,10,13,11,9,10,12,15,22,40,10].map(w=>({wch:w}));
        XLSX.utils.book_append_sheet(wb,ws,"Registos");
        const nd=Object.values(S.notasDia).filter(n=>esc_==="ano"||(esc_==="dia"?n.data===S.data:Number(n.data.slice(5,7))===S.mes+1)).sort((x,y)=>x.data<y.data?-1:1);
        if(nd.length){const w2=XLSX.utils.aoa_to_sheet([["Data","Espaço","Nota"]].concat(nd.map(n=>[n.data.split("-").reverse().join("/"),n.espaco,n.texto])));w2["!cols"]=[{wch:12},{wch:9},{wch:80}];XLSX.utils.book_append_sheet(wb,w2,"Notas do dia");}
        const out=XLSX.write(wb,{bookType:"xlsx",type:"array"});
        await S.dl.save({filename:nome+".xlsx",data:out});
      }
      $("#layer").innerHTML="";toast("Exportação pronta");
    }catch(err){if(!err||err.code!=="declined")toast("Não foi possível exportar ("+(err&&err.code||"erro")+").");}
  };
};

/* ---------- IMPORTAR ---------- */
$("#btnImp").onclick=()=>{
  $("#layer").innerHTML=`<div class="overlay" id="ov"><div class="modal" role="dialog" aria-label="Importar">
  <h2 style="font-size:18px">Importar de Excel, CSV ou backup JSON</h2>
  <span class="muted" style="font-size:13px">Aceita o ficheiro Registo_Acessos (folha "Registos") ou uma exportação desta app. Colunas lidas: Data, Espaço, Hora início, Nº quarto, Tipo, Nº pessoas, Observações/Notas. Registos iguais aos que já existem são ignorados.</span>
  <input type="file" id="i_f" accept=".xlsx,.xls,.csv,.json">
  <div id="i_res" class="prev" hidden></div>
  <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" id="i_c">Fechar</button><button class="btn primary" id="i_ok" disabled>Importar</button></div></div></div>`;
  $("#i_c").onclick=()=>{$("#layer").innerHTML="";};
  let pend=[],pendJ=null;
  $("#i_f").onchange=async ev=>{
    const file=ev.target.files[0];if(!file)return;
    const res=$("#i_res");res.hidden=false;res.textContent="A ler…";
    try{
      if(/\.json$/i.test(file.name)){
        if(!S.admin){res.textContent="Só os gestores podem restaurar um backup JSON.";return;}
        const j=JSON.parse(await file.text());
        const ok=x=>x&&typeof x.id==="string"&&/^[A-Za-z0-9_-]{1,64}$/.test(x.id)&&typeof x.data==="string";
        pendJ={r:(j.registos||[]).filter(ok),n:(j.notas_dia||[]).filter(x=>x&&typeof x.id==="string"&&/^[A-Za-z0-9_\-ºªÀ-ú]{1,64}$/.test(x.id)&&typeof x.data==="string")};
        pend=[];res.innerHTML=`Backup JSON: <b>${pendJ.r.length}</b> registos e <b>${pendJ.n.length}</b> notas do dia. Restaurar escreve cada documento com o mesmo identificador (se já existir, é substituído, por isso podes repetir sem criar duplicados).`;
        $("#i_ok").disabled=!(pendJ.r.length||pendJ.n.length);return;
      }
      if(!window.XLSX)throw new Error("lib");
      const wb=XLSX.read(await file.arrayBuffer(),{type:"array",cellDates:true});
      const sh=wb.Sheets["Registos"]||wb.Sheets[wb.SheetNames[0]];
      const aoa=XLSX.utils.sheet_to_json(sh,{header:1,raw:true,defval:""});
      const hi=aoa.findIndex(r=>String(r[0]).trim()==="Data");if(hi<0)throw new Error("cab");
      const H=aoa[hi].map(x=>String(x).trim().toLowerCase());
      const col=(...n)=>{for(const x of n){const i=H.indexOf(x);if(i>=0)return i;}return -1;};
      const c={d:col("data"),e:col("espaço"),h:col("hora início"),q:col("nº quarto"),t:col("tipo"),p:col("nº pessoas"),k:col("crianças"),sa:col("hora de saída"),n:col("observações","notas"),es:col("estado")};
      const toIso=v=>{if(v instanceof Date&&!isNaN(v)){return isoOf(new Date(v.getTime()+12*3600e3-0));}const m=String(v).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(m)return m[3]+"-"+pad(m[2])+"-"+pad(m[1]);const m2=String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);return m2?m2[0]:"";};
      const have=new Set(S.regs.map(r=>[r.data,r.espaco,r.hora,String(r.quarto||"").trim(),Number(r.pessoas)||1].join("|")));
      let bad=0,dup=0;pend=[];let k=0;
      for(const r of aoa.slice(hi+1)){
        const data=toIso(r[c.d]);let hora=String(r[c.h]||"").trim();if(/^\d:\d\d$/.test(hora))hora="0"+hora;
        const esp=String(r[c.e]||"").trim();
        if(!data&&!hora&&!esp)continue;
        if(!data||!HORAS.includes(hora)||!ESP.includes(esp)){bad++;continue;}
        const o={data,espaco:esp,hora,quarto:normQ(r[c.q]),tipo:TIPOS.includes(String(r[c.t]).trim())?String(r[c.t]).trim():"",pessoas:Math.max(1,Number(r[c.p])||1),criancas:c.k>=0?Math.max(0,Number(r[c.k])||0):0,saiu:c.sa>=0&&/^\d\d:\d\d$/.test(String(r[c.sa]).trim())?String(r[c.sa]).trim():"",notas:c.n>=0?String(r[c.n]||"").trim():"",criadoEm:Date.now()+(k++)};
        {const es=c.es>=0?({"reserva":"reserva","não veio":"faltou","nao veio":"faltou"})[String(r[c.es]).trim().toLowerCase()]:"";if(es)o.estado=es;}
        const key=[o.data,o.espaco,o.hora,o.quarto,o.pessoas].join("|");
        if(have.has(key)){dup++;continue;}pend.push(o);
      }
      const anos=[...new Set(pend.map(o=>o.data.slice(0,4)))].join(", ");
      res.innerHTML=`<b>${pend.length}</b> registos novos${anos?" (anos: "+anos+")":""}. Ignorados por já existirem: ${dup}. Linhas inválidas: ${bad}.`+(anos&&anos!==String(S.ano)?"<br>Só consigo detetar duplicados do ano que está aberto ("+S.ano+").":"");
      $("#i_ok").disabled=!pend.length;
    }catch(e){res.textContent="Não consegui ler o ficheiro. Confirma que tem uma coluna \"Data\" no cabeçalho.";}
  };
  $("#i_ok").onclick=async()=>{
    $("#i_ok").disabled=true;let n=0;
    if(pendJ){
      const all=pendJ.r.map(o=>["registos",o]).concat(pendJ.n.map(o=>["notas_dia",o]));
      for(let i=0;i<all.length;i+=20){
        const ok=await guardar(()=>Promise.all(all.slice(i,i+20).map(([c,o])=>{const d=Object.assign({},o);delete d.id;return S.db.collection(c).doc(o.id).set(d);})));
        if(!ok)break;n+=Math.min(20,all.length-i);$("#i_res").textContent="A restaurar… "+n+"/"+all.length;
      }
      toast("Restaurados "+n+" documentos");$("#layer").innerHTML="";return;
    }
    for(let i=0;i<pend.length;i+=20){
      const ok=await guardar(()=>Promise.all(pend.slice(i,i+20).map(o=>S.db.collection("registos").add(o))));
      if(!ok)break;n+=Math.min(20,pend.length-i);$("#i_res").textContent="A importar… "+n+"/"+pend.length;
    }
    toast("Importados "+n+" registos");$("#layer").innerHTML="";
  };
};

/* ---------- atualização automática (hora de início, dia, chips) ---------- */
let _slot=nextSlotHora(),_dia=today();
setInterval(()=>{
  const ns=nextSlotHora(),nd=today();
  if(nd!==_dia){build();const seguia=S.data===_dia;_dia=nd;if(seguia)S.data=nd;if(S.tab==="hoje")renderHoje();else if(S.tab==="registos")renderRegistosData();return;}
  if(ns===_slot)return;
  _slot=ns;build();
  if(S.tab!=="hoje"){refresh();return;}
  if(S.data===nd&&!S.form.horaManual){S.form.hora=ns;const sel=$("#fhora");if(sel)sel.value=ns;updatePrev();}
  const ae=document.activeElement;
  if(!(ae&&ae.closest&&ae.closest("#hojeData")&&/TEXTAREA|INPUT/.test(ae.tagName)))renderHojeData();
},30000);
init();
render();
})();
</script>
